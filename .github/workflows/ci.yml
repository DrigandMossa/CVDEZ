name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-22.04, python: "3.8"}
          - {os: ubuntu-latest, python: "3.13"}
          - {os: windows-latest, python: "3.13"}
          - {os: macos-latest, python: "3.13"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Byte-compile
        run: python -m compileall -q cvd cvdez
      - name: Tests
        run: python -m unittest discover -v -s tests
      - name: Run the whole tutorial without questions
        run: python -m cvdez --auto --out tutorial_out
